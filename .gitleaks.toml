# gitleaks configuration: the default rules plus the two patterns that the default rules missed in the Laravel repository
# (a password typed on a mysql command line, and the warehouse cipher settings assigned a literal).
title = "Credit Analyst"

[extend]
useDefault = true

[[rules]]
id = "mysql-cli-password"
description = "Password on a mysql / mysqldump command line (-pSECRET or --password=SECRET)"
regex = '''(?i)\bmysql(?:dump)?\b[^\n]*?\s(?:-p|--password=)([^\s"'<>$]{4,})'''
secretGroup = 1
keywords = ["mysql"]

[[rules]]
id = "secret-hashing-literal"
description = "SECRET_HASHING_KEY or SECRET_HASHING_IV assigned a literal value"
regex = '''(?i)\bSECRET_HASHING_(?:KEY|IV)\b\s*[=:]\s*["']?([A-Za-z0-9+/=_-]{8,})'''
secretGroup = 1
keywords = ["secret_hashing"]

[allowlist]
description = "Documented development values and examples: the throwaway root/root MySQL of scripts/schema/rebuild, the PasswordCipher test vector"
regexes = [
  '''^root$''',
  '''^test-(key|iv)$''',
]
paths = [
  '''(^|/)\.env\.example$''',
  '''^docs/security/''',
]
