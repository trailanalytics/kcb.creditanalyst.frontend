# What every proxied API request carries. The client address is set, not appended to: a client-supplied X-Forwarded-For must
# never reach the backend's sign-in throttle. If another proxy or load balancer sits in front of this nginx, configure nginx's
# realip module (set_real_ip_from / real_ip_header) so $remote_addr is still the browser's address.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_read_timeout 300s;
# the backend sends its own security headers; only HSTS is decided here, from the TLS state nginx can see
proxy_hide_header Strict-Transport-Security;
add_header Strict-Transport-Security $hsts_header always;
