# Security headers for everything nginx serves itself (the SPA and its assets). Included in every such location, because
# nginx drops the headers of an outer level as soon as a location sets one of its own (Cache-Control below).
#
# CSP: scripts only from this origin (the Vite build has no inline script). Styles keep 'unsafe-inline' because the dialog
# library injects a <style> element; scripts never get it. Everything the SPA fetches is same origin (/api).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
# empty (so not sent) unless the request came in over TLS; see the map in default.conf.template
add_header Strict-Transport-Security $hsts_header always;
