<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline — KCB Credit Analyst</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .card {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.10);
            max-width: 420px;
            width: 100%;
            padding: 2.5rem 2rem;
            text-align: center;
        }
        .logo {
            width: 80px;
            margin-bottom: 1.5rem;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #002c4d;
            margin-bottom: 0.5rem;
        }
        p {
            color: #6c757d;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background: #84bd00;
            color: #fff;
            text-decoration: none;
            padding: 0.6rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
        }
        .btn:hover { background: #6fa000; }
        .status {
            margin-top: 1.2rem;
            font-size: 0.82rem;
            color: #adb5bd;
        }
    </style>
</head>
<body>
    <div class="card">
        <img src="/img/pwa/icon-192.png" alt="Credit Analyst" class="logo" onerror="this.style.display='none'">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>
            No internet connection detected.<br>
            Please check your network and try again.
        </p>
        <button class="btn" onclick="window.location.reload()">Try Again</button>
        <p class="status">KCB Credit Analyst</p>
    </div>
</body>
</html>
