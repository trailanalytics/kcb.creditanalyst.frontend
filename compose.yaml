# Frontend only. The backend stack lives in ../kcb.creditanalyst.backend (docker compose up there first),
# or run the whole thing from the backend repo with `docker compose --profile full up --build`.
#   docker compose up --build              production-like: nginx on :8081, /api -> host backend on :8080
#   docker compose --profile dev up dev    Vite dev server with hot reload on :5173
name: creditanalyst-frontend

services:
  web:
    build: .
    image: kcb/creditanalyst-frontend:dev
    environment:
      API_UPSTREAM: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '${WEB_PORT:-8081}:80'

  dev:
    profiles: ['dev']
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_PROXY: ${API_UPSTREAM:-http://host.docker.internal:8080}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
